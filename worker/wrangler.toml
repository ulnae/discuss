# Discuss 后台服务（Cloudflare Worker）
# 部署：
#   wrangler d1 create discuss-data          → 把输出的 database_id 填到下面
#   wrangler d1 execute discuss-data --remote --file=./schema.sql
#   wrangler secret put JWT_SECRET
#   wrangler deploy
name = "discuss-api"
main = "src/index.js"
compatibility_date = "2026-04-01"
# 绑自定义域名后 Wrangler 会默认关闭 workers.dev；这里显式保留，
# 仅用于境外/调试直连（国内 DNS 被污染，生产环境不使用该地址）。
workers_dev = true

# 允许跨域的前端来源（逗号分隔；GitHub Pages + 本地开发）
[vars]
ALLOW_ORIGIN = "https://ulnae.github.io,http://localhost:8000,http://127.0.0.1:8000"
# 系统广播 POST /api/alert 的共享密钥。不要写在这里（配置文件会进仓库），
# 用 `wrangler secret put ALERT_SECRET` 配；不配则该接口直接返回 403（默认关闭）。
#
# JWT 过期时间，与 NestJS 的 JWT_EXPIRES_IN 保持同义（支持 24h / 7d / 3600s / 纯数字秒）
JWT_EXPIRES_IN = "24h"
# 是否强制校验图形验证码；调试期可设为 "false"
REQUIRE_CAPTCHA = "true"
# PBKDF2 迭代次数。免费版单次请求 CPU 上限 10ms，默认取 10000；
# 付费版可调到 100000，历史密码不受影响（哈希串里自带迭代次数）
PBKDF2_ITERATIONS = "10000"
# 单文件上限（字节）：图片 2MB、其它文档 5MB
# 前端会先压缩到长边 1920 / quality 0.82，正常落在 200–500KB
# KV 单值上限 25MiB，2MB/5MB 都远低于该值
UPLOAD_MAX_BYTES = "2097152"
UPLOAD_MAX_DOC_BYTES = "5242880"
# 配额（字节 / 次）：个人总量 64MB、每日 15MB 且不超过 20 次
QUOTA_USER_BYTES = "67108864"
QUOTA_USER_DAILY_BYTES = "15728640"
QUOTA_USER_DAILY_COUNT = "20"
# 全站每日上传次数硬保护：KV 免费版每天只有 1000 次写，
# 留 200 次给 cron 回收与重试，超过 800 次当天直接返回 429
QUOTA_GLOBAL_DAILY_COUNT = "800"
# 全局软上限 900MB（KV 免费 1GB，留 10% 余量）
QUOTA_GLOBAL_BYTES = "943718400"
# 文件保留天数（消息不落库，超期即回收）
# 同时作为 KV 的 expirationTtl：到期由 KV 自动删除，不占用每日 1000 次 delete 额度
RETENTION_DAYS = "30"

# D1（SQLite）数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "discuss-data"
database_id = "d85b8922-9fa9-4c39-9b20-9294046548b9"

# 实时通信：Durable Object（WebSocket Hibernation）
[[durable_objects.bindings]]
name = "HUB"
class_name = "DiscussHub"

[[migrations]]
tag = "v1"
# 免费版只支持 SQLite 存储后端的 Durable Object
new_sqlite_classes = ["DiscussHub"]

# 图片/文件上传（Workers KV）
# 免费额度：1GB 存储 / 10 万读/天 / 1000 写/天 / 单值 25MiB，且不需要绑卡。
# 读取走 Worker 内的 Cache API 边缘缓存，只有缓存未命中才消耗 KV 读额度。
[[kv_namespaces]]
binding = "UPLOAD"
id = "9b094aa97a984a8cac3a169c15db81e4"

# 每日存储回收：UTC 19:00 = 北京时间次日 03:00（避开使用高峰）
[triggers]
crons = ["0 19 * * *"]

# 自定义域名 —— 解决 workers.dev 在国内被 DNS 污染、WebSocket 永远连不上的问题。
# 前置条件：Cloudflare 里 ulnae.dpdns.org 这个 zone 已 Active（2026-11-12 已确认）。
# deploy 时 Cloudflare 会自动建 DNS 记录并签发证书，不需要手加 CNAME。
# 步骤见 README「让 WebSocket 在国内可用」。
[[routes]]
pattern = "discuss-api.ulnae.dpdns.org"
custom_domain = true
